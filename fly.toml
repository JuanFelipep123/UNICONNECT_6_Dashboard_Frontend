# fly.toml - Configuración de despliegue para Fly.io
# Generado para uniconnect-web (Vite + React SPA)

app = "uniconnect-web"
primary_region = "dfw"

[build]
  # Las variables VITE_* se pasan como build args en tiempo de compilación
  # ya que Vite las inyecta estáticamente en el bundle.
  # Se configuran en: fly secrets set o en el dashboard de Fly.io
  [build.args]
    VITE_API_BASE_URL            = "https://uniconnect-api-gateway.fly.dev/api"
    VITE_BACKEND_PUBLIC_URL      = "https://uniconnect-api-gateway.fly.dev"
    VITE_AUTH0_DOMAIN            = "dev-4y4ixca0s1czf015.us.auth0.com"
    VITE_AUTH0_CLIENT_ID         = "4fBnK3WGzxYmcphrqJO0OO7JbWe0i3PE"
    VITE_AUTH0_AUDIENCE          = "https://uniconnect-api"
    VITE_AUTH0_CONNECTION        = "google-oauth2"
    VITE_AUTH_SYNC_URL           = "https://uniconnect-api-gateway.fly.dev/auth/sync"
    VITE_AUTH_SESSION_URL        = "https://uniconnect-api-gateway.fly.dev/auth/session"
    VITE_AUTH0_REDIRECT_URI      = "https://uniconnect-web.fly.dev/auth/callback"
    VITE_CHAT_SERVICE_URL        = "https://uniconnect-chat-service.fly.dev"
    VITE_SUPABASE_URL            = "https://spbljhhxbjjaeqohuxaj.supabase.co"
    VITE_SUPABASE_ANON_KEY       = "sb_publishable_YUCJ8vnsDAHOZXLfWlzOpg_D4opgt7U"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150
